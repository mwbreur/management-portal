<!DOCTYPE html>
<html lang="en">
<head>
<style>
  @keyframes fadeOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.95); }
  }
  .animate-toast-fade {
    animation: fadeOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Management Portal</title>
  <!-- Correct CDN for Tailwind v4 Runtime Processing -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- Main Portal Shell -->
  <div class="w-full max-w-6xl bg-white rounded-xl shadow-xl overflow-hidden flex flex-col md:flex-row min-h-[600px]">
    
    <!-- Sidebar Container (Injected by sidebar.js) -->
    <aside id="sidebar-container" class="w-full md:w-64 bg-slate-900 text-slate-100 flex flex-col"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col">
      <!-- Header Container (Injected by header.js) -->
      <header id="header-container"></header>
      
      <!-- Dynamic Views Container (Injected by app.js) -->
      <main id="main-content" class="p-6 flex-1 bg-slate-50"></main>
    </div>

  </div>

  <!-- Load Module Scripts -->
  <script src="templates.js"></script>
  <script src="toast.js"></script>
  <script src="sidebar.js"></script>
  <script src="header.js"></script>
  <script src="app.js"></script>
</body>
</html>
